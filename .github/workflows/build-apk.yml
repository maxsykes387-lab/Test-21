name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PixelOrganiser-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release (direct phone download)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PixelOrganiser.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PixelOrganiser.apk --title "Pixel Organiser (latest build)" --notes "Debug build from ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
